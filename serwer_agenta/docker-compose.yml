# docker-compose: dwie uslugi z czystym API miedzy nimi.
#   api          -- harness + runtime agenta (FastAPI, CPU)
#   model-server -- vLLM z endpointem OpenAI-compatible (profil "gpu")
#
# Uruchomienie:
#   docker compose up api                     # samo API (LLM przez LLM_BASE_URL)
#   docker compose --profile gpu up           # API + lokalny vLLM (A100/16GB)
services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      # domyslnie model-server z compose; na Kaggle/Colab nadpisz:
      # LLM_BASE_URL=https://api.groq.com/openai  LLM_API_KEY=...
      LLM_BASE_URL: ${LLM_BASE_URL:-http://model-server:8000}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      API_TOKEN: ${API_TOKEN:-}        # opcjonalny token auth (dok. wdrozeniowy sek. 5)
    volumes:
      - ./runs:/srv/runs               # artefakty runow poza kontenerem
    restart: unless-stopped

  model-server:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]                  # uruchamiany tylko z --profile gpu
    command: >
      --model ${VLLM_MODEL:-Qwen/Qwen3-14B-AWQ}
      --max-model-len 8192
      --gpu-memory-utilization 0.9
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  hf-cache:
